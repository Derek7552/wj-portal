                                    </button>

    <script src="../../js/dashboard.js"></script>
    <script src="../../components/agent-sidebar.js"></script>
    <script src="../../components/chat-input.js"></script>
    <script src="../../templates/js/template-detail.js"></script>
    <script>
        // 模拟任务数据
        const mockTasks = [
            { id: '1', name: 'Web应用攻击面扫描', status: 'running', active: false },
            { id: '2', name: '服务器端口暴露检查', status: 'running', active: false },
            { id: '3', name: 'API接口安全审计', status: 'completed', active: false },
            { id: '4', name: '云服务配置检查', status: 'completed', active: false },
            { id: '5', name: '域名资产发现', status: 'completed', active: false },
            { id: '6', name: '子域名安全检查', status: 'completed', active: false },
            { id: '7', name: '暴露服务识别', status: 'completed', active: false },
            { id: '8', name: '网络资产扫描', status: 'completed', active: false },
            { id: '9', name: '安全配置评估', status: 'completed', active: false },
            { id: '10', name: '漏洞扫描结果分析', status: 'completed', active: false }
        ];

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 手动绑定"新任务"按钮点击事件
            var newTaskBtn = document.querySelector('.btn-new-chat');
            if (newTaskBtn) {
                newTaskBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('点击新任务按钮');

                    // 清除所有任务项的 active 状态
                    var taskItems = document.querySelectorAll('.recent-task-item');
                    taskItems.forEach(function(item) {
                        item.classList.remove('active');
                    });

                    var chatArea = document.querySelector('.agent-main-content');
                    if (!chatArea) return;

                    // 检查是否存在各种内容容器
                    var emptyStateContainer = document.querySelector('.empty-state-container');
                    var taskContent = document.querySelector('.task-detail-content');
                    var tasksList = document.querySelector('.tasks-list-container');
                    var attackSurfaceDetail = document.querySelector('.attack-surface-detail');

                    // 如果已有空状态容器，直接显示并隐藏其他内容
                    if (emptyStateContainer) {
                        emptyStateContainer.style.display = 'flex';
                        if (taskContent) taskContent.style.display = 'none';
                        if (tasksList) tasksList.style.display = 'none';
                        if (attackSurfaceDetail) attackSurfaceDetail.style.display = 'none';
                        return;
                    }

                    // 否则重新创建空状态页面
                    chatArea.innerHTML = '<div class="empty-state-container">' +
                        '<div class="empty-agent-name">' +
                            '<span class="agent-name-text">攻击面检查</span>' +
                        '</div>' +
                        '<div class="empty-state-guide">' +
                            '<p class="empty-state-guide-text">开始给智能体分配任务</p>' +
                        '</div>' +
                        '<div class="chat-input-container" data-container-mode="empty">' +
                            '<div class="chat-input-wrapper">' +
                                '<textarea class="chat-input" id="chatInput" placeholder="输入您的问题或粘贴代码..." rows="3"></textarea>' +
                                '<div class="chat-input-toolbar">' +
                                    '<div class="chat-input-actions">' +
                                        '<button class="btn-icon" title="上传文件">📎</button>' +
                                        '<button class="btn-icon" title="插入图片">🖼️</button>' +
                                        '<button class="btn-icon" title="插入代码">💻</button>' +
                                        '<button class="btn-icon" title="插入表格">📊</button>' +
                                    '</div>' +
                                    '<button class="btn btn-primary chat-send" id="chatSend">' +
                                        '<span>发送</span>' +
                                        '<span class="send-shortcut">Shift+Enter</span>' +
                                    '</button>' +
                                '</div>' +
                            '</div>' +
                        '</div>' +
                    '</div>';
                });
            }

            // 初始化侧导航组件（如果函数存在）
            if (typeof initAgentSidebar === 'function') {
                initAgentSidebar({
                tasks: mockTasks,
                maxTasks: 10,
                onNewTask: function() {
                    console.log('创建新任务');
                    // 点击新任务按钮时，显示空状态页面
                    var chatArea = document.querySelector('.agent-main-content');
                    if (!chatArea) return;

                    // 清除所有任务项的 active 状态
                    var taskItems = document.querySelectorAll('.recent-task-item');
                    taskItems.forEach(function(item) {
                        item.classList.remove('active');
                    });

                    // 检查是否存在各种内容容器
                    var emptyStateContainer = document.querySelector('.empty-state-container');
                    var taskContent = document.querySelector('.task-detail-content');
                    var tasksList = document.querySelector('.tasks-list-container');
                    var attackSurfaceDetail = document.querySelector('.attack-surface-detail');

                    // 如果已有空状态容器，直接显示并隐藏其他内容
                    if (emptyStateContainer) {
                        emptyStateContainer.style.display = 'flex';
                        if (taskContent) taskContent.style.display = 'none';
                        if (tasksList) tasksList.style.display = 'none';
                        if (attackSurfaceDetail) attackSurfaceDetail.style.display = 'none';
                        return;
                    }

                    // 否则重新创建空状态页面
                    chatArea.innerHTML = '<div class="empty-state-container">' +
                        '<div class="empty-agent-name">' +
                            '<span class="agent-name-text">攻击面检查</span>' +
                        '</div>' +
                        '<div class="empty-state-guide">' +
                            '<p class="empty-state-guide-text">开始给智能体分配任务</p>' +
                        '</div>' +
                        '<div class="chat-input-container" data-container-mode="empty">' +
                            '<div class="chat-input-wrapper">' +
                                '<textarea class="chat-input" id="chatInput" placeholder="输入您的问题或粘贴代码..." rows="3"></textarea>' +
                                '<div class="chat-input-toolbar">' +
                                    '<div class="chat-input-actions">' +
                                        '<button class="btn-icon" title="上传文件">📎</button>' +
                                        '<button class="btn-icon" title="插入图片">🖼️</button>' +
                                        '<button class="btn-icon" title="插入代码">💻</button>' +
                                        '<button class="btn-icon" title="插入表格">📊</button>' +
                                    '</div>' +
                                    '<button class="btn btn-primary chat-send" id="chatSend">' +
                                        '<span>发送</span>' +
                                        '<span class="send-shortcut">Shift+Enter</span>' +
                                    '</button>' +
                                '</div>' +
                            '</div>' +
                        '</div>' +
                    '</div>';
                },
                onTaskClick: function(taskId, taskData) {
                    console.log('[DEBUG] 点击任务:', taskId, taskData);

                    try {
                        // 更新任务项的active状态
                        var taskItems = document.querySelectorAll('.recent-task-item');
                        var taskName = (taskData && taskData.name) ? taskData.name : '未知任务';
                        
                        taskItems.forEach(function(item) {
                            var itemTaskName = item.querySelector('.task-name');
                            if (itemTaskName && itemTaskName.textContent.trim() === taskName) {
                                item.classList.add('active');
                            } else {
                                item.classList.remove('active');
                            }
                        });

                        var chatArea = document.querySelector('.agent-main-content');
                        if (!chatArea) {
                            console.error('[DEBUG] 未找到chatArea');
                            return;
                        }

                        console.log('[DEBUG] 找到chatArea');

                        // 如果是"Web应用攻击面扫描"任务，显示详情页面
                        if (taskName === 'Web应用攻击面扫描') {
                            showAttackSurfaceDetail(chatArea);
                            return;
                        }

                        // 其他任务显示聊天界面
                        // 清空chatArea并重新创建任务详情
                        chatArea.innerHTML = '';

                        var taskContent = document.createElement('div');
                        taskContent.className = 'task-detail-content';

                        taskContent.innerHTML = '<div class="chat-header">' +
                            '<div class="chat-title">' + taskName + '</div>' +
                            '<div class="chat-time">刚刚</div>' +
                        '</div>' +
                        '<div class="chat-messages">' +
                            '<div class="message message-user">' +
                                '<div class="message-avatar">👤</div>' +
                                '<div class="message-content">' +
                                    '<div class="message-time">刚刚</div>' +
                                    '<div class="message-text">请帮我检查一个Web应用的攻击面，重点关注暴露的端口和服务。</div>' +
                                '</div>' +
                            '</div>' +
                            '<div class="message message-ai">' +
                                '<div class="message-avatar">🤖</div>' +
                                '<div class="message-content">' +
                                    '<div class="message-time">刚刚</div>' +
                                    '<div class="message-text">你好！我将协助你进行攻击面检查。请提供目标域名或IP地址，我将全面扫描暴露的服务、端口和潜在安全风险。</div>' +
                                '</div>' +
                            '</div>' +
                            '<div class="message message-user">' +
                                '<div class="message-avatar">👤</div>' +
                                '<div class="message-content">' +
                                    '<div class="message-time">刚刚</div>' +
                                    '<div class="message-text">具体会检查哪些方面？</div>' +
                                '</div>' +
                            '</div>' +
                            '<div class="message message-ai">' +
                                '<div class="message-avatar">🤖</div>' +
                                '<div class="message-content">' +
                                    '<div class="message-time">刚刚</div>' +
                                    '<div class="message-text">我将重点检查以下方面：<br>1. 开放端口和服务识别<br>2. 子域名和资产发现<br>3. API接口暴露情况<br>4. 安全配置和加固建议</div>' +
                                '</div>' +
                            '</div>' +
                        '</div>' +
                        '<div class="chat-input-container" data-container-mode="fixed">' +
                            '<div class="chat-input-wrapper">' +
                                '<textarea class="chat-input" placeholder="输入您的问题或粘贴代码..." rows="3"></textarea>' +
                                '<div class="chat-input-toolbar">' +
                                    '<div class="chat-input-actions">' +
                                        '<button class="btn-icon" title="上传文件">📎</button>' +
                                        '<button class="btn-icon" title="插入图片">🖼️</button>' +
                                        '<button class="btn-icon" title="插入代码">💻</button>' +
                                        '<button class="btn-icon" title="插入表格">📊</button>' +
                                    '</div>' +
                                    '<button class="btn btn-primary chat-send">' +
                                        '<span>发送</span>' +
                                        '<span class="send-shortcut">Shift+Enter</span>' +
                                    '</button>' +
                                '</div>' +
                            '</div>' +
                        '</div>';

                        chatArea.appendChild(taskContent);
                        taskContent.style.display = 'flex';

                        console.log('[DEBUG] 任务详情已创建并显示');

                        // 滚动到底部
                        setTimeout(function() {
                            var chatMessages = taskContent.querySelector('.chat-messages');
                            if (chatMessages) {
                                chatMessages.scrollTop = chatMessages.scrollHeight;
                            }
                        }, 100);
                    } catch (error) {
                        console.error('[DEBUG] 错误:', error);
                    }
                },
                onViewAll: function() {
                    console.log('查看全部任务');
                    showAllTasks();
                }
                });
            } else {
                console.warn('initAgentSidebar 函数不存在，将使用手动绑定的事件处理');
            }

            // 初始化聊天输入框组件
            initChatInput({
                onSend: function(message) {
                    console.log('发送消息:', message);
                    // 模拟发送，实际应该调用API
                    // window.location.href = 'agent-detail-chat.html';
                }
            });

            // 手动绑定静态任务项的点击事件
            var taskItems = document.querySelectorAll('.recent-task-item');
            taskItems.forEach(function(item) {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    var taskName = item.querySelector('.task-name').textContent.trim();
                    
                    // 移除所有任务项的active状态
                    taskItems.forEach(function(taskItem) {
                        taskItem.classList.remove('active');
                    });
                    
                    // 为当前点击的任务项添加active状态
                    item.classList.add('active');
                    
                    // 查找对应的任务数据
                    var taskData = mockTasks.find(function(task) {
                        return task.name === taskName;
                    });
                    
                    if (!taskData) {
                        // 如果找不到，创建一个默认的任务数据
                        var statusIcon = item.querySelector('.task-status-icon');
                        var status = statusIcon && statusIcon.classList.contains('completed') ? 'completed' : 'running';
                        taskData = { 
                            id: String(mockTasks.length + 1), 
                            name: taskName, 
                            status: status 
                        };
                    }
                    
                    console.log('[DEBUG] 点击任务（手动绑定）:', taskData.id, taskData);

            // 更新表格数据
            function updateTableData(type) {
                var container = document.getElementById('exposureTableContainer');
                if (!container) return;

                var data = getTableDataByType(type);
                var tableHTML = '<table class="exposure-table">' +
                    '<thead><tr>';

                // 生成表头
                data.headers.forEach(function(header) {
                    tableHTML += '<th>' + header + '</th>';
                });
                tableHTML += '</tr></thead><tbody>';

                // 生成表格内容
                data.rows.forEach(function(row) {
                    tableHTML += '<tr>';
                    row.forEach(function(cell) {
                        tableHTML += '<td>' + cell + '</td>';
                    });
                    tableHTML += '</tr>';
                });

                tableHTML += '</tbody></table>';
                container.innerHTML = tableHTML;

                // 绑定"查询"按钮点击事件
                bindQueryAssetButtons();

                // 绑定资产名称链接点击事件（仅对代码/文档类型）
                if (type === 'code-doc') {
                    bindAssetNameLinks();
                }
            }

            // 绑定资产名称链接点击事件
            function bindAssetNameLinks() {
                var assetLinks = document.querySelectorAll('.asset-link[data-name]');
                assetLinks.forEach(function(link) {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        var assetName = this.getAttribute('data-name');
                        console.log('点击资产名称:', assetName);
                        // 可以在这里添加预览文档或其他功能
                        // 例如：显示文档内容、打开新窗口等
                    });
                });
            }

            // 绑定"查询资产"按钮事件
            function bindQueryAssetButtons() {
                var queryButtons = document.querySelectorAll('.btn-query-asset');
                queryButtons.forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        var title = this.getAttribute('data-title');
                        sendAssetQueryMessage(title);
                    });
                });
            }

            // 发送资产查询消息到对话区域
            function sendAssetQueryMessage(assetTitle) {
                var chatMessagesContainer = document.querySelector('.chat-messages');
                if (!chatMessagesContainer) return;

                var message = '详情分析「' + assetTitle + '」资产';
                var timestamp = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

                // 创建用户消息
                var userMessageHTML = '<div class="message message-user">' +
                    '<div class="message-avatar">👤</div>' +
                    '<div class="message-content">' +
                        '<div class="message-time">' + timestamp + '</div>' +
                        '<div class="message-text">' + message + '</div>' +
                    '</div>' +
                '</div>';

                // 添加到对话区域
                chatMessagesContainer.insertAdjacentHTML('beforeend', userMessageHTML);

                // 滚动到底部
                var messagesContainer = document.querySelector('.chat-messages-container');
                if (messagesContainer) {
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }

                // 模拟AI回复（可选）
                setTimeout(function() {
                    var aiMessageHTML = '<div class="message message-ai">' +
                        '<div class="message-avatar">🤖</div>' +
                        '<div class="message-content">' +
                            '<div class="message-time">' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) + '</div>' +
                            '<div class="message-text">正在分析「' + assetTitle + '」资产的详细信息，请稍候...</div>' +
                        '</div>' +
                    '</div>';
                    chatMessagesContainer.insertAdjacentHTML('beforeend', aiMessageHTML);

                    if (messagesContainer) {
                        messagesContainer.scrollTop = messagesContainer.scrollHeight;
                    }
                }, 500);
            }

            // 绑定统计项点击事件
            var statItems = chatArea.querySelectorAll('.exposure-stat-item');
            statItems.forEach(function(item) {
                item.addEventListener('click', function() {
                    // 切换选中状态
                    statItems.forEach(function(i) { i.classList.remove('active'); });
                    item.classList.add('active');

                    // 获取数据类型并更新表格
                    var type = item.getAttribute('data-type');
                    updateTableData(type);
                });
            });

            // 绑定标签页切换事件
            var tabs = chatArea.querySelectorAll('.analysis-tab');
            var contentPanels = chatArea.querySelectorAll('.analysis-content');
            
            tabs.forEach(function(tab) {
                tab.addEventListener('click', function() {
                    var targetTab = this.getAttribute('data-tab');
                    
                    // 切换标签的active状态
                    tabs.forEach(function(t) { 
                        t.classList.remove('active'); 
                    });
                    this.classList.add('active');
                    
                    // 切换内容区域的显示
                    contentPanels.forEach(function(panel) {
                        var panelType = panel.getAttribute('data-content');
                        if (panelType === targetTab) {
                            panel.classList.add('active');
                        } else {
                            panel.classList.remove('active');
                        }
                    });
                });
            });

            // 绑定重新查询按钮事件
            var requeryBtn = chatArea.querySelector('#requeryBtn');
            if (requeryBtn) {
                requeryBtn.addEventListener('click', function() {
                    // 更新查询时间
                    var queryTimeElement = chatArea.querySelector('#queryTime');
                    if (queryTimeElement) {
                        queryTimeElement.textContent = formatDateTime(new Date());
                    }
                    
                    // 这里可以添加重新查询的逻辑
                    console.log('重新查询攻击面扫描');
                    // TODO: 调用API重新查询
                });
            }
        }

        // 快速提示填充功能
        function fillPrompt(text) {
            const input = document.getElementById('chatInput');
            if (input) {
                input.value = text;
                input.focus();
            }
        }

        // 格式化日期时间
        function formatDateTime(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return year + '-' + month + '-' + day + ' ' + hours + ':' + minutes + ':' + seconds;
        }
