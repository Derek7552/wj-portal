    <script>
        // 模拟任务数据
        const mockTasks = [
            { id: '1', name: '可疑邮件分析', status: 'running', active: false },
            { id: '2', name: '钓鱼链接检测', status: 'running', active: false },
            { id: '3', name: '社交工程攻击识别', status: 'completed', active: false },
            { id: '4', name: '钓鱼网站分析', status: 'completed', active: false },
            { id: '5', name: '邮件安全培训', status: 'completed', active: false },
            { id: '6', name: '钓鱼防护建议', status: 'completed', active: false },
            { id: '7', name: '可疑域名检测', status: 'completed', active: false },
            { id: '8', name: '社交工程手段分析', status: 'completed', active: false },
            { id: '9', name: '钓鱼邮件特征识别', status: 'completed', active: false },
            { id: '10', name: '安全防护策略咨询', status: 'completed', active: false }
        ];

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 警告横幅关闭
            const warningBanner = document.getElementById('warningBanner');
            const warningCloseBtn = document.getElementById('warningCloseBtn');
            
            if (warningCloseBtn && warningBanner) {
                warningCloseBtn.addEventListener('click', function() {
                    warningBanner.style.display = 'none';
                });
            }

            // 高级配置开关
            const advancedToggle = document.getElementById('advancedToggle');
            if (advancedToggle) {
                advancedToggle.addEventListener('click', function() {
                    this.classList.toggle('active');
                });
            }

            // 刷新配置按钮
            const configRefreshBtn = document.getElementById('configRefreshBtn');
            if (configRefreshBtn) {
                configRefreshBtn.addEventListener('click', function() {
                    // 添加旋转动画
                    this.style.transform = 'rotate(360deg)';
                    this.style.transition = 'transform 0.5s';
                    
                    setTimeout(() => {
                        this.style.transform = 'rotate(0deg)';
                        // 这里可以添加刷新配置的逻辑
                        console.log('刷新配置');
                    }, 500);
                });
            }

            // 输入框自动调整高度 - 使用统一组件的高度限制
            const chatInput = document.getElementById('phishingChatInput');
            if (chatInput) {
                chatInput.addEventListener('input', function() {
                    // 统一组件已处理高度限制，这里只需要重置高度让浏览器自动计算
                    this.style.height = 'auto';
                    // chat-input 的 min-height 是 120px，max-height 由组件控制
                });
            }

            // 发送消息
            const sendBtn = document.getElementById('phishingSendBtn');
            const chatMessagesArea = document.getElementById('chatMessagesArea');
            
            function sendMessage() {
                if (!chatInput || !chatMessagesArea) return;
                
                const message = chatInput.value.trim();
                if (!message) return;

                // 添加用户消息
                addUserMessage(message);
                
                // 清空输入框
                chatInput.value = '';
                chatInput.style.height = 'auto';

                // 模拟AI回复
                setTimeout(() => {
                    addAIMessage('根据您的配置要求，正在生成钓鱼邮件...');
                }, 1000);
            }

            function addUserMessage(text) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message message-user';
                messageDiv.innerHTML = `
                    <div class="message-avatar">👤</div>
                    <div class="message-content">
                        <div class="message-bubble">
                            <p>${escapeHtml(text)}</p>
                        </div>
                    </div>
                `;
                chatMessagesArea.appendChild(messageDiv);
                scrollToBottom();
            }

            function addAIMessage(text) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message';
                messageDiv.innerHTML = `
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">
                        <div class="message-bubble">
                            <p>${escapeHtml(text)}</p>
                        </div>
                    </div>
                `;
                chatMessagesArea.appendChild(messageDiv);
                scrollToBottom();
            }

            function scrollToBottom() {
                if (chatMessagesArea) {
                    chatMessagesArea.scrollTop = chatMessagesArea.scrollHeight;
                }
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            if (sendBtn) {
                sendBtn.addEventListener('click', sendMessage);
            }

            if (chatInput) {
                chatInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendMessage();
                    }
                });
            }


            // 附件按钮
            const attachBtn = document.getElementById('attachBtn');
            if (attachBtn) {
                attachBtn.addEventListener('click', function() {
                    console.log('上传文件');
                    // 实现文件上传功能
                });
            }

            // 初始化侧导航组件
            initAgentSidebar({
                tasks: mockTasks,
                maxTasks: 10,
                onNewTask: function() {
                    console.log('创建新任务');
                    // 清空消息区域
                    if (chatMessagesArea) {
                        chatMessagesArea.innerHTML = '';
                    }
                    // 重置表单
                    const form = document.getElementById('phishingConfigForm');
                    if (form) {
                        form.reset();
                    }
                },
                onTaskClick: function(taskId, taskData) {
                    console.log('[DEBUG] 点击任务:', taskId, taskData);

                    try {
                        // 清空消息区域
                        if (chatMessagesArea) {
                            chatMessagesArea.innerHTML = '';
                        }
                        
                        // 重置表单
                        const form = document.getElementById('phishingConfigForm');
                        if (form) {
                            form.reset();
                        }

                        // 可以在这里加载任务相关的配置数据
                        // 例如：根据taskData填充表单字段
                    } catch (error) {
                        console.error('[DEBUG] 错误:', error);
                    }
                },
                onViewAll: function() {
                    console.log('查看全部任务');
                    showAllTasks();
                }
            });

            // 初始化聊天输入框组件
            initChatInput({
                onSend: function(message) {
                    console.log('发送消息:', message);
                    // 模拟发送，实际应该调用API
                }
            });

            // 初始化拖拽分隔条
            initPanelResizer();
        });

        // ==========================================
        // 拖拽分隔条功能
        // ==========================================
        function initPanelResizer() {
            const resizer = document.getElementById('panelResizer');
            const configPanel = document.querySelector('.phishing-config-panel');
            const chatPanel = document.querySelector('.phishing-chat-panel');

            if (!resizer || !configPanel || !chatPanel) {
                console.warn('拖拽分隔条初始化失败：未找到必要元素');
                return;
            }

            let isResizing = false;
            let startX = 0;
            let startWidth = 0;

            // 从 localStorage 读取保存的宽度
            const savedWidth = localStorage.getItem('phishing-config-panel-width');
            if (savedWidth) {
                const width = parseInt(savedWidth, 10);
                if (width >= 300 && width <= 600) {
                    configPanel.style.flexBasis = width + 'px';
                }
            }

            // 鼠标按下开始拖拽
            resizer.addEventListener('mousedown', function(e) {
                e.preventDefault();
                isResizing = true;
                startX = e.clientX;
                startWidth = configPanel.offsetWidth;

                // 添加拖拽状态类
                resizer.classList.add('resizing');
                document.body.classList.add('resizing');
            });

            // 鼠标移动时调整宽度
            document.addEventListener('mousemove', function(e) {
                if (!isResizing) return;

                const deltaX = e.clientX - startX;
                const newWidth = startWidth + deltaX;

                // 限制最小和最大宽度
                const minWidth = 300;
                const maxWidth = 600;
                const containerWidth = configPanel.parentElement.offsetWidth;
                const chatMinWidth = 400;
                const maxAllowedWidth = containerWidth - chatMinWidth - 24 - 24 - 4; // 减去间距和分隔条

                const finalWidth = Math.min(
                    Math.max(newWidth, minWidth),
                    Math.min(maxWidth, maxAllowedWidth)
                );

                configPanel.style.flexBasis = finalWidth + 'px';
            });

            // 鼠标松开结束拖拽
            document.addEventListener('mouseup', function() {
                if (!isResizing) return;

                isResizing = false;
                resizer.classList.remove('resizing');
                document.body.classList.remove('resizing');

                // 保存当前宽度到 localStorage
                const currentWidth = configPanel.offsetWidth;
                localStorage.setItem('phishing-config-panel-width', currentWidth);
            });

            // 防止拖拽时选中文本
            resizer.addEventListener('selectstart', function(e) {
                e.preventDefault();
            });
        }

        // 显示全部任务列表
        function showAllTasks() {
            var chatArea = document.querySelector('.phishing-chat-panel');
            if (!chatArea) return;

            // 生成任务列表HTML
            var tasksHtml = '';
            for (var i = 0; i < mockTasks.length; i++) {
                var task = mockTasks[i];
                var statusIcon = task.status === 'running' ? '⏳' :
                                task.status === 'completed' ? '✅' : '❌';
                var statusClass = task.status;

                tasksHtml += '<div class="task-record-card" data-task-id="' + task.id + '">' +
                    '<div class="task-record-left">' +
                        '<div class="task-record-header">' +
                            '<div class="task-record-status">' +
                                '<span class="task-status-badge ' + statusClass + '">' + statusIcon + '</span>' +
                            '</div>' +
                            '<div class="task-record-name">' + task.name + '</div>' +
                        '</div>' +
                        '<div class="task-record-statistics">' +
                            '<span class="statistics-label">消息数</span>' +
                            '<span class="statistics-value">' + (4 + Math.floor(Math.random() * 6)) + ' 条</span>' +
                        '</div>' +
                    '</div>' +
                    '<div class="task-record-right">' +
                        '<div class="task-record-time">2025-12-19 14:30</div>' +
                        '<div class="task-record-actions">' +
                            '<button class="task-action-btn">查看</button>' +
                            '<button class="task-action-btn">删除</button>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }

            if (mockTasks.length === 0) {
                tasksHtml = '<div class="tasks-empty">暂无任务记录</div>';
            }

            // 替换内容
            chatArea.innerHTML = '<div class="tasks-list-container">' +
                '<div class="tasks-list-header">' +
                    '<h2 class="tasks-list-title">全部任务记录</h2>' +
                '</div>' +
                '<div class="tasks-list-content">' +
                    tasksHtml +
                '</div>' +
            '</div>';

            // 绑定任务卡片点击事件
            var taskCards = chatArea.querySelectorAll('.task-record-card');
            for (var i = 0; i < taskCards.length; i++) {
                taskCards[i].addEventListener('click', function(e) {
                    // 如果点击的是按钮，不触发卡片点击
                    if (e.target.classList.contains('task-action-btn')) {
                        e.stopPropagation();
                        var btnText = e.target.textContent;
                        var taskId = this.getAttribute('data-task-id');

                        if (btnText === '查看') {
                            // 查找对应的任务并显示详情
                            var selectedTask = null;
                            for (var j = 0; j < mockTasks.length; j++) {
                                if (mockTasks[j].id === taskId) {
                                    selectedTask = mockTasks[j];
                                    break;
                                }
                            }

                            if (selectedTask) {
                                // 调用现有的任务点击回调
                                var sidebarInstance = window.agentSidebarInstance;
                                if (sidebarInstance && sidebarInstance.setActiveTask) {
                                    sidebarInstance.setActiveTask(taskId);
                                }

                                // 显示任务详情（复用之前的代码）
                                showTaskDetailById(taskId, selectedTask);
                            }
                        } else if (btnText === '删除') {
                            if (confirm('确定要删除此任务吗？')) {
                                console.log('删除任务:', taskId);
                            }
                        }
                        return;
                    }

                    // 点击卡片其他区域，显示任务详情
                    var taskId = this.getAttribute('data-task-id');
                    var selectedTask = null;
                    for (var j = 0; j < mockTasks.length; j++) {
                        if (mockTasks[j].id === taskId) {
                            selectedTask = mockTasks[j];
                            break;
                        }
                    }

                    if (selectedTask) {
                        showTaskDetailById(taskId, selectedTask);
                    }
                });
            }
        }

        // 根据任务ID显示任务详情
        function showTaskDetailById(taskId, taskData) {
            // 清空消息区域
            if (chatMessagesArea) {
                chatMessagesArea.innerHTML = '';
            }
            
            // 重置表单
            const form = document.getElementById('phishingConfigForm');
            if (form) {
                form.reset();
            }

            // 可以在这里加载任务相关的配置数据
            // 例如：根据taskData填充表单字段
            console.log('加载任务:', taskId, taskData);
        }

        // 快速提示填充功能
        function fillPrompt(text) {
            const input = document.getElementById('chatInput');
            if (input) {
                input.value = text;
                input.focus();
            }
        }
    </script>
</body>
</html>
